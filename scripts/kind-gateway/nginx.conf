worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3001;
        server_name _;

        resolver 127.0.0.11 valid=5s;

        # WebSocket Upgrade/Connection header pass-through
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming and buffer controls (SSE / chunked data path)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # Timeouts (long-lived SSE stream protection)
        proxy_connect_timeout 3s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        location / {
            set $node_upstream http://desktop-control-plane:30300;
            proxy_pass $node_upstream;
        }
    }
}
