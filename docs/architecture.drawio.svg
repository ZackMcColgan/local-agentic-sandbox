<text x="972" y="435" font-size="12" fill="#475569">trace UI via /jaeger/</text>

<!-- ======= cluster bottom row ======= -->
<rect x="424" y="508" width="500" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
