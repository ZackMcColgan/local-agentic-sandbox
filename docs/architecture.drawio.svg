<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1140px" height="850px" viewBox="-0.5 -0.5 1140 850" style="background-color: #ffffff;">
  <defs>
    <style type="text/css">
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer Host Machine Boundary -->
  <rect x="20" y="15" width="1100" height="820" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="20" y="15" width="1100" height="40" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="40" y="40" font-size="14" font-weight="bold" fill="#0f172a">HOST MACHINE BOUNDARY (AMD Ryzen 7 5700X3D + Radeon RX 9070 XT 16GB VRAM ROCm)</text>

  <!-- Client Ingress Box -->
  <rect x="440" y="70" width="260" height="55" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="93" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Client / Mobile Web UI</text>
  <text x="570" y="112" font-size="11" fill="#0369a1" text-anchor="middle">http://192.168.50.254:3000 (LAN) • Zero Pills</text>

  <!-- Web UI Orchestrator -->
  <rect x="410" y="155" width="320" height="80" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="180" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Container: web-ui (Orchestrator)</text>
  <text x="570" y="198" font-size="11" fill="#4338ca" text-anchor="middle">Next.js 15 • LangGraph StateGraph Supervision</text>
  <text x="570" y="216" font-size="10" fill="#64748b" text-anchor="middle">Mode A: Overnight Builder | Mode B: Local Oracle</text>

  <!-- Ingress arrow -->
  <path d="M 570 125 L 570 155" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Network 1: ai-mesh (Air-gapped) -->
  <rect x="40" y="260" width="480" height="550" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <rect x="40" y="260" width="480" height="34" rx="14" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="60" y="283" font-size="12" font-weight="bold" fill="#065f46">NETWORK: ai-mesh (internal: true, zero internet egress)</text>

  <!-- Container: Ollama Engine -->
  <rect x="65" y="315" width="430" height="100" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="340" font-size="12" font-weight="bold" fill="#0f172a">Container: ollama (Local AI Engine)</text>
  <text x="85" y="360" font-size="11" fill="#065f46">Port: 11434 • GPU Acceleration: ROCm Host Passthrough</text>
  <text x="85" y="380" font-size="10" fill="#64748b">Models: Qwen 3.8 / Gemma 4 • Air-Gapped Zero Egress</text>
  <text x="85" y="398" font-size="10" fill="#047857">Volume: ollama_data:/root/.ollama</text>

  <!-- Container: mcp-server (Exec Tier) -->
  <rect x="65" y="435" width="430" height="175" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="460" font-size="12" font-weight="bold" fill="#0f172a">Exec Tier: mcp-server (Hardened Runner)</text>
  <text x="85" y="480" font-size="11" fill="#047857">Port: 8080 (SSE) • Execution Boundary</text>
  <text x="85" y="500" font-size="10" fill="#0f172a">• read_only: true rootfs (Immutable)</text>
  <text x="85" y="518" font-size="10" fill="#0f172a">• cap_drop: ALL Linux capabilities</text>
  <text x="85" y="536" font-size="10" fill="#0f172a">• UID: 10001 (unprivileged builder user)</text>
  <text x="85" y="554" font-size="10" fill="#0f172a">• tmpfs: /tmp (rw, noexec, nosuid, size=64m)</text>
  <text x="85" y="572" font-size="10" fill="#0f172a">• Air-gapped zero egress (blocks npm install, pip, curl)</text>
  <text x="85" y="592" font-size="10" fill="#047857">Bind Mount: ./workspace:/workspace:rw</text>

  <!-- Observability: jaeger -->
  <rect x="65" y="630" width="430" height="90" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="655" font-size="12" font-weight="bold" fill="#0f172a">Container: jaeger / otel-collector</text>
  <text x="85" y="675" font-size="11" fill="#475569">Ports: 16686 (UI), 4318 (HTTP OTLP), 4317 (gRPC)</text>
  <text x="85" y="695" font-size="10" fill="#64748b">Telemetry: Distributed Spans &amp; Trace Waterfalls</text>

  <!-- Network 2: egress-mesh -->
  <rect x="600" y="260" width="480" height="550" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <rect x="600" y="260" width="480" height="34" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="620" y="283" font-size="12" font-weight="bold" fill="#0369a1">NETWORK: egress-mesh (bridge, restricted outbound)</text>

  <!-- Container: browser-mcp -->
  <rect x="625" y="315" width="430" height="135" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="340" font-size="12" font-weight="bold" fill="#0f172a">Container: browser-mcp (Isolated Scraper)</text>
  <text x="645" y="360" font-size="11" fill="#0369a1">Port: 8081 (SSE) • Web Ingestion Boundary</text>
  <text x="645" y="380" font-size="10" fill="#0f172a">• UID: 10002 (unprivileged non-root user)</text>
  <text x="645" y="398" font-size="10" fill="#0f172a">• no-new-privileges: true security profile</text>
  <text x="645" y="416" font-size="10" fill="#0f172a">• Strict SSRF Protection Filter (blocks LAN / metadata IPs)</text>
  <text x="645" y="434" font-size="10" fill="#0369a1">• HTML-to-Markdown Distillation Engine</text>

  <!-- Build Tier: Pre-baked Toolchains -->
  <rect x="625" y="470" width="430" height="200" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="645" y="495" font-size="12" font-weight="bold" fill="#0f172a">Build Tier: Pre-Baked Toolchains (New in v2.5)</text>
  <text x="645" y="515" font-size="11" fill="#6d28d9">Pre-baked Images: deploy/builder-*/</text>
  <text x="645" y="535" font-size="10" fill="#0f172a">• builder-node:22 (Node.js 22 LTS, npm, yarn, pnpm)</text>
  <text x="645" y="553" font-size="10" fill="#0f172a">• builder-python:3.12 (Python 3.12, pip, poetry, build-essential)</text>
  <text x="645" y="571" font-size="10" fill="#0f172a">• builder-go:latest, builder-rust:latest</text>
  <text x="645" y="589" font-size="10" fill="#0f172a">• Egress allowlist strictly to package registries (npm, PyPI) &amp; GitHub</text>
  <text x="645" y="607" font-size="10" fill="#0f172a">• Volume: build-cache (20GB Disk Budget Cap)</text>
  <text x="645" y="625" font-size="10" fill="#0f172a">• Automated Cache Pruning: caches &gt; 7 days cleaned</text>
  <text x="645" y="645" font-size="10" fill="#6d28d9">Writable Mount: /workspace:rw for compiling software</text>

  <!-- Connection Lines from web-ui -->
  <path d="M 450 235 L 280 235 L 280 315" stroke="#10b981" stroke-width="2" fill="none"/>
  <path d="M 470 235 L 280 235 L 280 435" stroke="#059669" stroke-width="2" fill="none"/>
  <path d="M 670 235 L 840 235 L 840 315" stroke="#0284c7" stroke-width="2" fill="none"/>
  <path d="M 690 235 L 840 235 L 840 470" stroke="#8b5cf6" stroke-width="2" fill="none"/>

</svg>
