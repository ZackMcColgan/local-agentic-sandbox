<rect x="602" y="338" width="142" height="42" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="673" y="363" text-anchor="middle" font-size="11" fill="#1e293b">supervisor / scheduler</text>
<rect x="756" y="338" width="142" height="42" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="827" y="363" text-anchor="middle" font-size="11.5" fill="#1e293b">work board</text>
