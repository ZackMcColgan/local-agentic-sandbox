<text x="376" y="443" text-anchor="middle" font-size="10.5" fill="#475569">tool calls</text>

<!-- ======= footer ======= -->
<text x="660" y="692" text-anchor="middle" font-size="12.5" fill="#64748b">Local-only by design — inference, tools, and data never leave this machine. The host bridge is the single, approval-gated boundary.</text>
