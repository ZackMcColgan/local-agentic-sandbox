<text x="448" y="562" font-size="12" fill="#475569">sandboxed pod · read-only rootfs</text>
<text x="448" y="582" font-size="12" fill="#475569">cap_drop ALL · GitHub :443 only</text>
<rect x="948" y="508" width="308" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="972" y="540" font-size="14.5" font-weight="700" fill="#0f172a">Browser MCP</text>
