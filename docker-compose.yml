services:
  # 1. Local AI Engine (Air-Gapped)
  ollama:
    image: ollama/ollama:latest
    container_name: local-ai-engine
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-mesh
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  # 2. Sandboxed MCP Server (Execution Boundary)
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: sandboxed-mcp-toolchain
    restart: unless-stopped
    read_only: true
    environment:
      - PORT=8080
      - GIT_CONFIG_GLOBAL=/tmp/.gitconfig
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./workspace:/workspace:rw
    networks:
      - ai-mesh
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  # 3. Dedicated Browser MCP Server (Egress & Scraping Boundary)
  browser-mcp:
    build:
      context: ./browser-mcp
      dockerfile: Dockerfile
    container_name: browser-mcp-toolchain
    restart: unless-stopped
    user: "10002:10002"
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-mesh
      - egress-mesh
    environment:
      - PORT=8081

  # 4. Next.js Web UI & Orchestrator
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: enterprise-ai-portal
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MCP_SERVER_URL=http://mcp-server:8080/sse
      - BROWSER_MCP_URL=http://browser-mcp:8081/sse
      - MODEL_NAME=qwen3.8:27b-q3_k_m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-mesh
      - egress-mesh
    depends_on:
      - mcp-server
      - browser-mcp

networks:
  ai-mesh:
    internal: true # Zero internet access
    driver: bridge
  egress-mesh:
    driver: bridge

volumes:
  ollama_data:
