name: Bug Report
description: Report a functional bug (not a vulnerability — use private vulnerability reporting for those)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything exploitable, do not open a public issue. Use GitHub private
        vulnerability reporting (see `SECURITY.md`).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or UI steps, from a clean checkout.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text and the command that produced it.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: e.g. web-ui/, host-bridge/, mcp-server/, browser-mcp/, deploy/helm/, container image tag.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` and `node --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
