apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "local-agentic-sandbox.fullname" . }}-workspace
  labels:
    {{- include "local-agentic-sandbox.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.workspace.accessMode }}
  {{- if .Values.workspace.storageClassName }}
  storageClassName: {{ .Values.workspace.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspace.storageSize }}
