apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-runner-zero-egress
  namespace: local-agentic-sandbox
  labels:
    app.kubernetes.io/name: local-agentic-sandbox
    app.kubernetes.io/component: security-policy
spec:
  podSelector:
    matchLabels:
      app: mcp-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Rule 1: Allow incoming HTTP requests ONLY from the web-ui orchestrator
    - from:
        - podSelector:
            matchLabels:
              app: web-ui
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Rule 1: Allow DNS resolution (TCP/UDP port 53) to kube-dns/coredns
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Rule 2: Allow HTTPS strictly to GitHub IP endpoints for git operations (clone/push).
    # Default GitHub IP CIDRs below can be overridden/parameterized via Helm (.Values.networkPolicies.githubCIDRs).
    - to:
        - ipBlock:
            cidr: 140.82.112.0/20
        - ipBlock:
            cidr: 192.30.252.0/22
        - ipBlock:
            cidr: 185.199.108.0/22
      ports:
        - protocol: TCP
          port: 443
    # ALL OTHER EGRESS IS DROPPED BY DEFAULT (Default Deny Egress)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ui-policy
  namespace: local-agentic-sandbox
  labels:
    app.kubernetes.io/name: local-agentic-sandbox
spec:
  podSelector:
    matchLabels:
      app: web-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow client traffic into the web-ui on port 3000
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication to mcp-runner
    - to:
        - podSelector:
            matchLabels:
              app: mcp-runner
      ports:
        - protocol: TCP
          port: 8080
    # Allow communication to browser-mcp
    - to:
        - podSelector:
            matchLabels:
              app: browser-mcp
      ports:
        - protocol: TCP
          port: 8081
    # Allow communication to otel-collector
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
    # Allow communication to host ollama (or in-cluster ollama)
    - ports:
        - protocol: TCP
          port: 11434
    # Allow communication to Qdrant vector database (Oracle memory)
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: browser-mcp-policy
  namespace: local-agentic-sandbox
  labels:
    app.kubernetes.io/name: local-agentic-sandbox
spec:
  podSelector:
    matchLabels:
      app: browser-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-ui
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow general HTTP/HTTPS egress for web research & search tools
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-policy
  namespace: local-agentic-sandbox
  labels:
    app.kubernetes.io/name: local-agentic-sandbox
    app.kubernetes.io/component: security-policy
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic ONLY from web-ui on ports 6333 and 6334
    - from:
        - podSelector:
            matchLabels:
              app: web-ui
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
  egress:
    # Allow DNS resolution within cluster
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
