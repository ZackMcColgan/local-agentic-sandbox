apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-runner
  namespace: local-agentic-sandbox
  labels:
    app: mcp-runner
    app.kubernetes.io/name: local-agentic-sandbox
    app.kubernetes.io/component: sandboxed-toolchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-runner
  template:
    metadata:
      labels:
        app: mcp-runner
        tier: sandbox
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-runner
          image: local-agentic-sandbox-mcp-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: mcp-http
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            - name: WORKSPACE_DIR
              value: "/workspace"
            - name: GIT_CONFIG_GLOBAL
              value: "/tmp/.gitconfig"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "2000m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace
            - name: tmpfs-volume
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: workspace-volume
          persistentVolumeClaim:
            claimName: pvc-workspace
        - name: tmpfs-volume
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-runner
  namespace: local-agentic-sandbox
  labels:
    app: mcp-runner
    app.kubernetes.io/name: local-agentic-sandbox
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: mcp-runner
