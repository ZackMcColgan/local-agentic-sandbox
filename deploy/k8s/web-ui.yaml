apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: local-agentic-sandbox
  labels:
    app: web-ui
    app.kubernetes.io/name: local-agentic-sandbox
    app.kubernetes.io/component: portal-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-ui
      app.kubernetes.io/part-of: local-agentic-sandbox
      app.kubernetes.io/version: "1.0.0"
  template:
    metadata:
      labels:
        app: web-ui
        app.kubernetes.io/part-of: local-agentic-sandbox
        app.kubernetes.io/version: "1.0.0"
        tier: frontend
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        supplementalGroups: [10001]
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-ui
          image: local-agentic-sandbox-web-ui:v-a34483e
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: AGENT_CHECKPOINT_DIR
              value: "/workspace/.agent/checkpoints"
            - name: PORT
              value: "3000"
            - name: LLM_BASE_URL
              value: "http://strata-service:8080"
            - name: LLM_HOST
              value: "http://strata-service:8080"
            - name: OLLAMA_BASE_URL
              value: "http://llm-service:11434"
            - name: OLLAMA_HOST
              value: "http://llm-service:11434"
            - name: MCP_SERVER_URL
              value: "http://mcp-runner:8080/sse"
            - name: BROWSER_MCP_URL
              value: "http://browser-mcp:8081/sse"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: OTEL_SERVICE_NAME
              value: "enterprise-ai-portal"
            - name: MODEL_NAME
              value: "qwen3.8-flash-next-gyro-gyro-s"
            - name: PLANNER_MODEL
              value: "qwen3.8-flash-next-gyro-gyro-s"
            - name: SUBAGENT_MODEL
              value: "qwen3.8-flash-next-gyro-gyro-s"
            - name: LLM_ENGINE
              value: "strata"
            - name: LLAMACPP_BASE_URL
              value: "http://strata-service:8080"
            - name: LLM_CONCURRENCY
              value: "1"
            - name: LLM_SUPERVISOR_TOKEN
              value: "local-sandbox-token-2026"
            - name: WORKER_MODEL_TIMEOUT_MS
              value: "900000"
            - name: THREADS_DIR
              value: "/workspace/.agent/threads"
            - name: HOST_RUNNER_URL
              value: "http://host-runner-service:8765"
            - name: HOST_RUNNER_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: sandbox-host-runner
                  key: shared-secret
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sandbox-telegram
                  key: bot-token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: sandbox-telegram
                  key: chat-id
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1000m"
              memory: "384Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: workspace-volume
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: workspace-volume
          persistentVolumeClaim:
            claimName: pvc-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: local-agentic-sandbox
  labels:
    app: web-ui
    app.kubernetes.io/name: local-agentic-sandbox
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
      name: http
  selector:
    app: web-ui
