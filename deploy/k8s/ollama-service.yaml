apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: local-agentic-sandbox
  labels:
    app: ollama-service
    app.kubernetes.io/name: local-agentic-sandbox
    app.kubernetes.io/component: inference-engine
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: ollama-api
---
# Optional: In-cluster ROCm GPU accelerated Pod for bare-metal Kubernetes nodes with AMD Radeon GPU
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-rocm-gpu
  namespace: local-agentic-sandbox
  labels:
    app: ollama-rocm-gpu
spec:
  replicas: 0 # Scaled to 0 by default when using host passthrough; scale to 1 for in-cluster GPU execution
  selector:
    matchLabels:
      app: ollama-rocm-gpu
  template:
    metadata:
      labels:
        app: ollama-rocm-gpu
        tier: ai-compute
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:rocm
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: api
          resources:
            limits:
              k8s.amd.com/gpu: "1"
              memory: "16Gi"
            requests:
              memory: "8Gi"
          securityContext:
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      volumes:
        - name: ollama-models
          emptyDir: {}
